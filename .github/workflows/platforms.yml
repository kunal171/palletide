name: Native platforms
on:
  pull_request:
    paths: ["crates/**", "examples/**", "Cargo.*", "rust-toolchain.toml", ".github/workflows/platforms.yml", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo build -p palletide-codegen -p palletide-example-transfers --locked
      - run: cargo run -p palletide-codegen --locked -- --version
