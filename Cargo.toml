[workspace]
resolver = "2"
members = [
    "crates/palletide-core",
    "crates/palletide-source",
    "crates/palletide-store",
    "crates/palletide",
    "examples/*",
    # Added in subsequent feature branches as each is implemented:
    "crates/palletide-graphql",
    "crates/palletide-config",
    "crates/palletide-codegen",
]
# The starter template is a standalone project (git-deps on the published crates),
# not a workspace member — exclude it so `cargo build` never tries to compile it
# against the local workspace.
exclude = ["templates/starter"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/kunal171/palletide"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# substrate client + scale
subxt = "0.51.1"
parity-scale-codec = { version = "3", features = ["derive"] }
scale-value = "0.18"

# storage
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "json", "bigdecimal"] }

# graphql / http
async-graphql = "7"
# Schema parsing for palletide-codegen (same major as async-graphql, already in tree)
async-graphql-parser = "7"
async-graphql-axum = "7"
axum = "0.8"

# observability (optional — behind the `metrics` feature of the `palletide` crate)
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# serde / config
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
toml = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

# errors / logging
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# misc
hex = "0.4"
# SS58 address encoding (base58 + blake2 checksum), for configurable-prefix signer addresses
base58 = "0.2"
blake2 = "0.11"

# internal
palletide = { path = "crates/palletide", version = "0.4.0" }
palletide-core = { path = "crates/palletide-core", version = "0.4.0" }
palletide-source = { path = "crates/palletide-source", version = "0.4.0" }
palletide-store = { path = "crates/palletide-store", version = "0.4.0" }
palletide-graphql = { path = "crates/palletide-graphql", version = "0.4.0" }
palletide-config = { path = "crates/palletide-config", version = "0.4.0" }

[profile.release]
opt-level = 3
lto = "thin"
