[package]
name = "my-indexer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "my-indexer"
path = "src/main.rs"

[dependencies]
# The palletide framework crates. Pinned to the repo; swap for a crates.io version
# once published.
palletide = { git = "https://github.com/kunal171/palletide" }
palletide-source = { git = "https://github.com/kunal171/palletide" }
palletide-store = { git = "https://github.com/kunal171/palletide" }
palletide-graphql = { git = "https://github.com/kunal171/palletide" }
palletide-config = { git = "https://github.com/kunal171/palletide" }

async-graphql = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
